<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1000px; height:480px; }
  body {
    font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(620px 320px at 86% -14%, rgba(38,86,168,.10), transparent 70%),
      radial-gradient(420px 260px at 4% 112%, rgba(31,138,91,.07), transparent 70%),
      linear-gradient(135deg,#ffffff 0%,#f5f9ff 55%,#eef4fd 100%);
    color:#16202e; position:relative; overflow:hidden;
  }
  /* 详情页用 background-size:cover 渲染，会裁边 → 内容一律放在中间安全区（左右各留 10%） */
  .frame { position:absolute; inset:26px; border:1px solid rgba(38,86,168,.11); border-radius:22px; }
  .wrap { position:absolute; left:100px; right:100px; top:0; bottom:0;
          display:flex; align-items:center; gap:34px; }

  .brand { width:268px; flex:none; }
  .logo { width:62px; height:62px; border-radius:16px; display:block;
          box-shadow:0 8px 18px rgba(38,86,168,.24); }
  .name { font-size:35px; font-weight:600; letter-spacing:.4px; margin-top:13px; line-height:1.1; }
  .pkg  { font-family:Consolas,"Cascadia Mono",monospace; font-size:12px; color:#97a3b6; margin-top:7px; }
  .tag  { font-size:15.5px; color:#46536b; margin-top:11px; letter-spacing:.2px; }
  .tag b { color:#2656a8; font-weight:600; }

  .sep { width:1px; align-self:stretch; margin:150px 0; flex:none;
         background:linear-gradient(180deg,transparent,rgba(38,86,168,.16) 20%,rgba(38,86,168,.16) 80%,transparent); }

  .feats { flex:1; display:flex; flex-direction:column; gap:12px; }
  .feat { display:flex; align-items:center; gap:14px; padding:13px 17px; border-radius:13px;
          background:rgba(255,255,255,.86); border:1px solid rgba(23,43,74,.07);
          box-shadow:0 4px 12px rgba(23,43,74,.05); }
  .sq { width:36px; height:36px; border-radius:10px; flex:none; display:flex;
        align-items:center; justify-content:center; }
  .blue  { background:#e8f0fb; }
  .green { background:#e6f5ee; }
  .ft { font-size:18px; font-weight:600; letter-spacing:.2px; }
  .fs { font-size:15px; color:#5c6979; margin-top:4px; letter-spacing:.1px; }
  .fs em { font-style:normal; color:#1f8a5b; font-weight:600; }
  .fs u { text-decoration:none; color:#2656a8; font-weight:600; }
</style>
</head>
