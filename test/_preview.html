<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 设计尺寸 1600×930（比例 1.72）
     详情页用 background-size:cover 渲染，容器比例随窗口在 1.5~2.1 浮动，
     最坏按 1.4 与 2.6 也算过：
       容器更窄（r_c=1.4）→ 左右各裁 9.3%
       容器更扁（r_c=2.6）→ 上下各裁 16.9%
     所以内容一律收进 x∈[15%,85%]、y∈[22%,78%] 的中心安全框，四周只留背景。 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:930px; }
  body {
    font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(980px 520px at 84% -12%, rgba(38,86,168,.13), transparent 70%),
      radial-gradient(700px 420px at 6% 110%, rgba(31,138,91,.09), transparent 70%),
      linear-gradient(135deg,#ffffff 0%,#f6f9ff 52%,#e9f1fd 100%);
    color:#16202e; position:relative; overflow:hidden;
  }
  /* 安全框：left/right 240 (=15%)，top 204 (=22%)，bottom 205 */
  .wrap { position:absolute; left:240px; right:240px; top:204px; bottom:205px;
          display:flex; align-items:center; gap:46px; }

  .brand { width:420px; flex:none; }
  .logo { width:92px; height:92px; border-radius:22px; display:block;
          box-shadow:0 12px 26px rgba(38,86,168,.26); }
  .name { font-size:56px; font-weight:600; letter-spacing:.5px; margin-top:16px; line-height:1.12; }
  .pkg  { font-family:Consolas,"Cascadia Mono",monospace; font-size:16px; color:#97a3b6; margin-top:10px; }
  .tag  { font-size:21px; color:#46536b; margin-top:14px; letter-spacing:.2px; }
  .tag b { color:#2656a8; font-weight:600; }

  .sep { width:1px; align-self:stretch; margin:26px 0; flex:none;
         background:linear-gradient(180deg,transparent,rgba(38,86,168,.18) 18%,rgba(38,86,168,.18) 82%,transparent); }

  .feats { flex:1; display:flex; flex-direction:column; gap:18px; }
  .feat { display:flex; align-items:center; gap:20px; padding:20px 26px; border-radius:18px;
          background:rgba(255,255,255,.9); border:1px solid rgba(23,43,74,.07);
          box-shadow:0 6px 18px rgba(23,43,74,.06); }
  .sq { width:52px; height:52px; border-radius:14px; flex:none; display:flex;
        align-items:center; justify-content:center; }
  .blue  { background:#e8f0fb; }
  .green { background:#e6f5ee; }
  .ft { font-size:26px; font-weight:600; letter-spacing:.2px; }
  .fs { font-size:20px; color:#5c6979; margin-top:6px; letter-spacing:.1px; }
  .fs em { font-style:normal; color:#1f8a5b; font-weight:600; }
  .fs u { text-decoration:none; color:#2656a8; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="../icon.png" alt="">
      <div class="name">文档附件管家</div>
      <div class="pkg">siyuan-plugin-attachment-kit</div>
      <div class="tag">附件改名、批量导出，<b>一点就成</b></div>
    </div>
    <div class="sep"></div>
    <div class="feats">
      <div class="feat">
        <div class="sq blue">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#2656a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h4l10-10a2.6 2.6 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5 17.5 10.5"/>
          </svg>
        </div>
        <div>
          <div class="ft">按锚文本改附件名</div>
          <div class="fs">锚文本写进文件名，<u>只改当前文档的附件</u></div>
        </div>
      </div>
      <div class="feat">
        <div class="sq green">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1f8a5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.4h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5v-10z"/>
            <path d="M12 11.5v4.5"/><path d="M9.6 14l2.4 2.4 2.4-2.4"/>
          </svg>
        </div>
        <div>
          <div class="ft">一键导出全部附件</div>
          <div class="fs">按正文顺序 <em>001-</em> 编号，含图片，导完弹窗</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
